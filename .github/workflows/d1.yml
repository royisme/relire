name: D1 publish tests

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'scripts/content-service/**'
      - 'scripts/grammar-topics/publish*'
      - 'scripts/vocabulary/publish*'
      - 'scripts/graded-readers/publishRemote*'
      - 'tests/d1Target.test.ts'
      - 'tests/gradedReaderRemotePublish.test.ts'
      - 'tests/fixtures/workerDb*'
      - '.github/workflows/d1.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'scripts/content-service/**'
      - 'scripts/grammar-topics/publish*'
      - 'scripts/vocabulary/publish*'
      - 'scripts/graded-readers/publishRemote*'
      - 'tests/d1Target.test.ts'
      - 'tests/gradedReaderRemotePublish.test.ts'
      - 'tests/fixtures/workerDb*'
      - '.github/workflows/d1.yml'

jobs:
  d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The same Bun as package.json "packageManager", so CI runs what developers run.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --cwd worker --frozen-lockfile
      - run: bun run test:d1
