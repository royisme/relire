name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Worker typecheck
        run: bun install --cwd worker --frozen-lockfile && cd worker && bun run typecheck
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Unit tests
        run: bun run test
      - name: Grammar pack
        run: bun scripts/grammar-pack/build.ts --check
      - name: Noun gender
        run: bun scripts/noun-gender/build.ts --check
      - name: Grammar topics
        run: bun scripts/grammar-topics/publish.ts --check
      - name: Translations
        run: bun run i18n:check
      - name: Build
        run: bun run build
