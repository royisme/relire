    <!-- Theme before first paint (same rules as src/theme/theme.ts) -->
    <script>
      (function () {
        var p = 'system';
        try { p = localStorage.getItem('relire_theme') || 'system'; } catch (e) {}
        if (p !== 'light' && p !== 'sepia' && p !== 'dark') p = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = p;
      })();
    </script>
